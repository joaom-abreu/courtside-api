services:
  api:
    build: .
    container_name: courtside-api
    environment:
      HTTP_PORT: 8080
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: courtside-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courtside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtside}
      POSTGRES_DB: ${POSTGRES_DB:-courtside}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: