services:
  api:
    build: .
    container_name: courtside-api
    environment:
      HTTP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-courtside}:${POSTGRES_PASSWORD:-courtside}@db:5432/${POSTGRES_DB:-courtside}?sslmode=disable
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1
    container_name: courtside-migrate
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-courtside}:${POSTGRES_PASSWORD:-courtside}@db:5432/${POSTGRES_DB:-courtside}?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: courtside-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courtside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtside}
      POSTGRES_DB: ${POSTGRES_DB:-courtside}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: